name: Java CI

on:
  push:
    branches: [ trunk, main ]
  pull_request:
    branches: [ trunk, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build, test and verify coverage
        run: ./gradlew clean build --info

      - name: Sonar Analysis
        # Advisory only: skipped when no SONAR_TOKEN is configured, and never
        # blocks the build when SonarCloud rejects the token (403) or is down.
        # Remove `continue-on-error` to make the quality gate blocking.
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true
