spring:
  application:
    name: dmoney
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    changelog: classpath:db/changelog/db.changelog-master.xml

jwt:
  secret: ${JWT_SECRET}
